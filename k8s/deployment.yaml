apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-deployment
  namespace: jenkins-builds
  labels:
    app: petclinic
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: amithps1996/spring-petclinic:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
